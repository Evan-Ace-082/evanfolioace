name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: /My-Portfolio/
      VITE_SUPABASE_URL: https://janmqvhvwafrklgdeqll.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fNE_y5yoIl8eENo85p6YyQ_grKVzoru
      VITE_SUPABASE_PROJECT_ID: janmqvhvwafrklgdeqll
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static site
        run: npx vite build --config vite.config.pages.ts

      - name: Add SPA fallback + disable Jekyll
        run: |
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
